<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShiftChex</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f5fa8'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' fill='none' stroke='white' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="bar">
  <div class="container wide bar-inner">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#2f5fa8"/><path d="M9 16.5l4.5 4.5L23 11.5" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      ShiftChex
    </div>
    <nav id="nav" aria-label="Screens"></nav>
    <div class="who" id="who" hidden>
      <span id="signedin"></span>
      <button id="reset" class="quiet sm" title="Put the demo data back" aria-label="Reset demo"><span class="label">Reset demo</span></button>
      <button id="signout" class="ghost sm" aria-label="Sign out"><span class="label">Sign out</span></button>
    </div>
  </div>
</header>
<main id="view" class="container"><p class="muted loading">Loading…</p></main>
<div id="toast" class="toast" role="status" hidden></div>
<script type="module" src="/js/main.js"></script>
</body>
</html>
