# DigitalOcean App Platform spec. CI fills in ${IMAGE_TAG}, then
# `doctl apps create --upsert` creates the app or updates it
name: shiftchex
region: nyc

# DNS is at Cloudflare: both names are CNAMEs to the app's ondigitalocean.app address,
# DNS only (not proxied), and App Platform sets up the https certificates
domains:
  - domain: shiftchex.work
    type: PRIMARY
  - domain: www.shiftchex.work
    type: ALIAS

services:
  - name: web
    # the account's own container registry (DOCR), so App Platform needs no extra login
    image:
      registry_type: DOCR
      repository: shiftchex
      tag: ${IMAGE_TAG}
    http_port: 8080
    instance_count: 1
    # the smallest size, about $5 a month
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /api/me
    envs:
      - key: PORT
        value: "8080"
